# Freedreno GPU Configuration for SteamPhone
# Adreno 650 (Snapdragon 865 variant)

# Mesa environment variables
export MESA_GL_VERSION_OVERRIDE=4.5
export MESA_GLSL_VERSION_OVERRIDE=450

# Freedreno/Adreno specific
export FD_MESA_DEBUG=0

# Vulkan
export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/freedreno_icd.aarch64.so

# GPU power management - performance mode
export ADRENO_MESA_DEBUG=0
