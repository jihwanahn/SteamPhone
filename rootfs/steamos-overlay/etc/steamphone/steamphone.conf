# SteamPhone System Configuration
# /etc/steamphone/steamphone.conf

# Device model (auto-detected at first boot)
# Values: exynos990, sd865
STEAMPHONE_DEVICE=auto

# Display orientation for gaming
# Values: landscape, portrait, auto
STEAMPHONE_ORIENTATION=landscape

# Display refresh rate
# Values: 60, 120
STEAMPHONE_REFRESH_RATE=120

# GPU performance profile
# Values: balanced, performance, powersave
STEAMPHONE_GPU_PROFILE=balanced

# Thermal throttle temperature (Celsius)
STEAMPHONE_THERMAL_LIMIT=80

# Enable touchscreen gamepad overlay
STEAMPHONE_GAMEPAD=true

# Gamepad layout file
STEAMPHONE_GAMEPAD_LAYOUT=/etc/steamphone/gamepad-layout.json

# Audio backend
STEAMPHONE_AUDIO=pipewire

# WiFi power save
STEAMPHONE_WIFI_POWERSAVE=true

# Enable SSH server
STEAMPHONE_SSH=true

# Auto-start Steam on boot
STEAMPHONE_AUTOSTART_STEAM=true

# Swap size (zram)
STEAMPHONE_ZRAM_SIZE=4G
