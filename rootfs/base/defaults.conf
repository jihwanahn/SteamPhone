# SteamPhone base system defaults
# Applied during first boot via steamphone-init

# Device configuration
STEAMPHONE_DEVICE=sd865
STEAMPHONE_GPU_DRIVER=freedreno

# Audio configuration
STEAMPHONE_AUDIO_BACKEND=pipewire

# Display
STEAMPHONE_DISPLAY_ORIENTATION=landscape
STEAMPHONE_REFRESH_RATE=120

# Performance
STEAMPHONE_GPU_PROFILE=balanced
STEAMPHONE_THERMAL_LIMIT=80
STEAMPHONE_ZRAM_SIZE=4G

# Features
STEAMPHONE_GAMEPAD=true
STEAMPHONE_SSH=false
STEAMPHONE_AUTOSTART_STEAM=true
