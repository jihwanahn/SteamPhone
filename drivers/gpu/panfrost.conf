# SteamPhone - Panfrost GPU Configuration
# Mali-G77 MP11 (Exynos 990 variant)
#
# Environment variables for Mesa Panfrost driver optimization

# Force Panfrost driver (should be auto-detected)
MESA_LOADER_DRIVER_OVERRIDE=panfrost

# Performance tuning
PAN_MESA_DEBUG=
PANFROST_PERF=1

# Vulkan (panvk - experimental)
# PanVK is still under development. For Vulkan, games may need:
# VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/panfrost_icd.aarch64.json

# OpenGL version override (some games check for minimum version)
# Panfrost supports OpenGL ES 3.1 and OpenGL 3.1
MESA_GL_VERSION_OVERRIDE=3.1
MESA_GLSL_VERSION_OVERRIDE=310

# Disable features that may cause issues on Mali
MESA_NO_ERROR=1
