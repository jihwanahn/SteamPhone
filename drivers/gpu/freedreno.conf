# SteamPhone - Freedreno GPU Configuration
# Adreno 650 (Snapdragon 865 variant)
#
# Environment variables for Mesa Freedreno/Turnip driver optimization

# Force Freedreno driver
MESA_LOADER_DRIVER_OVERRIDE=msm

# Turnip (Vulkan driver for Adreno)
# Turnip has much better Vulkan support than PanVK
MESA_VK_WSI_PRESENT_MODE=fifo

# Performance tuning
FD_MESA_DEBUG=
IR3_SHADER_DEBUG=

# OpenGL version
# Freedreno supports OpenGL ES 3.2 and OpenGL 3.3
MESA_GL_VERSION_OVERRIDE=3.3
MESA_GLSL_VERSION_OVERRIDE=330

# Adreno-specific optimizations
TU_DEBUG=
MESA_NO_ERROR=1
